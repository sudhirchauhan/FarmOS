name: Planning and sunlight checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements.txt
      - name: Validate calculations, API and migrations
        run: |
          .venv/bin/python backend/manage.py test planning
          .venv/bin/python backend/manage.py check
          .venv/bin/python backend/manage.py makemigrations --check --dry-run
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: frontend
        run: npm run test:e2e
